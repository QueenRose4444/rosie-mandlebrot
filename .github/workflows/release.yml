name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build and package only; publishing needs a tag.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: GNU toolchain (rug needs it on Windows)
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      # gmp-mpfr-sys compiles GMP and MPFR from C, which needs MSYS2's tools.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            diffutils m4 make mingw-w64-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$USERPROFILE\.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$USERPROFILE\.rustup}"
          export PATH="$(cygpath "$CARGO_HOME")/bin:$PATH"
          bash tools/release-build.sh
      - run: python tools/third_party.py
      - run: python tools/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-latest
    # Built on Debian 12 so the binary runs on glibc 2.36 and newer.
    container: debian:bookworm
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential m4 curl ca-certificates git python3 xz-utils
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      - uses: actions/checkout@v4
      - name: Build
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          . "$HOME/.cargo/env"
          bash tools/release-build.sh
          python3 tools/third_party.py
          python3 tools/package.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.xz

  image:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/queenrose4444/rosie-mandlebrot:${{ github.ref_name }}
            ghcr.io/queenrose4444/rosie-mandlebrot:latest
          labels: |
            org.opencontainers.image.source=https://github.com/QueenRose4444/rosie-mandlebrot
            org.opencontainers.image.description=Rosie_Mandlebrot: GPU deep zooms into the Mandelbrot set
            org.opencontainers.image.licenses=MIT

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, signature, manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get install -y minisign
          python3 tools/release_manifest.py "${{ github.ref_name }}"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/key"
          minisign -S -s "$RUNNER_TEMP/key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig \
            -t "Rosie_Mandlebrot ${{ github.ref_name }}"
          rm -f "$RUNNER_TEMP/key"
          minisign -V -p minisign.pub -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
      - name: Release notes
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = (index($0, v) == 1)} p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Rosie_Mandlebrot ${{ github.ref_name }}" --notes-file notes.md
