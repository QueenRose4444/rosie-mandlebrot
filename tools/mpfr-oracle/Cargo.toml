# Checks the pure-Rust high-precision arithmetic against MPFR, bit for bit, and
# times the two. Not part of the workspace and never shipped: it is the only
# thing in the repository that still links GMP/MPFR.
[package]
name = "mpfr-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rosie_mandlebrot_core = { path = "../../crates/core" }
rosie_mandlebrot_ref = { path = "../../crates/ref" }
num-complex = "0.4"
tracing = "0.1"
rug = { version = "=1.28.0", default-features = false, features = ["float", "integer", "rational"] }
gmp-mpfr-sys = { version = "=1.6.8", default-features = false, features = ["mpfr"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
