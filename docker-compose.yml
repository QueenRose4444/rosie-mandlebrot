# Rosie_Mandlebrot's web UI on a server with an NVIDIA GPU, in one file.
#
#   Portainer: Stacks -> Add stack -> Web editor, paste this file, Deploy.
#   Or:        docker compose up -d   (in the folder holding this file)
#
# Then open http://<the server's address>:8460 in a browser. Renders, videos
# and settings live in the rosie_mandlebrot_data volume; a render interrupted
# by a restart carries on by itself. There is no password: keep port 8460 on
# your own network (or behind your own proxy). See DEPLOY.md for the GPU setup.
services:
  rosie_mandlebrot:
    image: ghcr.io/queenrose4444/rosie-mandlebrot:latest
    container_name: rosie_mandlebrot
    restart: unless-stopped
    ports:
      - "8460:8460"
    # The GPU renders; the CPU makes the reference orbit and encodes the video.
    # cpus is a hard cap ("4.0" = four cores); mem_limit a memory cap.
    cpus: "4.0"
    mem_limit: 2g
    environment:
      - RUST_LOG=info
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    volumes:
      - rosie_mandlebrot_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility, graphics]

volumes:
  rosie_mandlebrot_data:
