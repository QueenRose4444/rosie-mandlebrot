server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;   # frames mounted at .../frames, page at .../site

    # The gallery page.
    location = / {
        try_files /site/index.html =404;
    }

    # Directory listing as JSON (name / mtime / size per entry). The page filters
    # frame_*.png and sorts newest-first. The listing is live, so never cache it.
    location /frames/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
    }

    # On-the-fly THUMBNAILS for the grid: resize a full 4K frame to fit 400x400.
    # Must precede the generic .png location below (first matching regex wins) so
    # /thumb/* isn't served at full size. Each frame name is immutable, so the
    # browser caches the result hard — the resize cost is paid once per frame.
    location ~ ^/thumb/(frame_\d+\.png)$ {
        alias /usr/share/nginx/html/frames/$1;
        image_filter resize 400 400;
        image_filter_buffer 64M;        # must exceed the source PNG size
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Medium PREVIEW for the hero (latest frame): crisp but light (~fits 1280).
    location ~ ^/preview/(frame_\d+\.png)$ {
        alias /usr/share/nginx/html/frames/$1;
        image_filter resize 1280 1280;
        image_filter_buffer 64M;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Full-resolution frame images (clicked-through / fallback). A regex location
    # takes priority over the /frames/ prefix for .png requests; root (not alias)
    # avoids the alias/try_files footgun. PNGs are immutable once written.
    location ~* \.png$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
