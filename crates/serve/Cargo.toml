[package]
name = "rosie_mandlebrot_serve"
description = "The web UI: an HTTP server that runs each render as a child copy of the program, one GPU job at a time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rosie_mandlebrot_core.workspace = true
rosie_mandlebrot_render.workspace = true
rosie_mandlebrot_run.workspace = true
rosie_mandlebrot_store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
time.workspace = true
axum = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
