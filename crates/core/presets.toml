# Built-in presets. Override with --presets FILE (or MANDELBROT_PRESETS).
#
# A preset supplies a location and a look, never a budget: frames, duration,
# resolution, iteration cap and storage are always the user's choice.
#
#   name               a-z, 0-9 and _, passed as --preset NAME
#   formula            the iteration rule; "mandelbrot" (the default) for now
#   kind               nucleus | misiurewicz | landmark | view
#   period, preperiod  for a nucleus its period; for a Misiurewicz point the
#                      preperiod and period of the cycle it lands on
#   center_re/im       decimal strings, parsed at the run's precision
#   initial_span       starting view width (3 = the whole set)
#   suggested_palette  hot | grayscale | electric | rainbow | ember | spectrum | neon | aurora | sunset | wine | deepspace
#   suggested_zoom_end how deep the location keeps producing structure. It can
#                      be written as a string ("1e-400") to go past f64.
#   zoom_factor, iter_per_depth, iter_exponent
#                      optional pace and iteration growth
#
# Every centre was derived by Newton's method from its defining equation, not
# copied, and the tests re-check it: a nucleus must have its period as the last
# rung of its atom-domain ladder, a Misiurewicz point's orbit must land on its
# cycle, a bulb root must match its closed form. `--ladder` prints the ladder
# for any centre.

